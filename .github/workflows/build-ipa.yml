name: Build VLC-iOS Ultimate IPA (Hikaproj Edition)

on:
  push:
    branches: [ master, main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:
    inputs:
      build_configuration:
        description: 'Build Configuration'
        required: true
        default: 'Release'
        type: choice
        options:
          - Release
          - Debug
      scheme_name:
        description: 'Target Scheme'
        required: true
        default: 'VLC-iOS-no-watch'
        type: choice
        options:
          - VLC-iOS-no-watch
          - VLC-iOS
      target_ios_version:
        description: 'Minimum iOS Deployment Target'
        required: true
        default: '16.1'
        type: choice
        options:
          - '16.1'
          - '16.0'
          - '17.0'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-ipa:
    name: Build & Package iOS 16+ IPA
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Select Latest Stable Xcode (15 / 16+)
        run: |
          echo "=== Searching for available Xcode installations ==="
          ls -d /Applications/Xcode*.app
          
          # Dynamically select highest installed Xcode version
          LATEST_XCODE=$(find /Applications -name "Xcode*.app" -maxdepth 1 | sort -V | tail -n 1)
          echo "Selected Xcode: $LATEST_XCODE"
          sudo xcode-select -s "$LATEST_XCODE/Contents/Developer"
          xcodebuild -version

      - name: Verify CocoaPods Environment
        run: |
          which pod || brew install cocoapods
          pod --version

      - name: Cache CocoaPods Dependencies
        uses: actions/cache@v4
        with:
          path: Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Install CocoaPods
        run: |
          pod install --repo-update

      - name: Resolve Swift Package Dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -workspace "VLC.xcworkspace" \
            -scheme "${{ github.event.inputs.scheme_name || 'VLC-iOS-no-watch' }}"

      - name: Build Archive (iOS 16.1+ Optimized)
        env:
          CONFIG: ${{ github.event.inputs.build_configuration || 'Release' }}
          SCHEME: ${{ github.event.inputs.scheme_name || 'VLC-iOS-no-watch' }}
          IOS_VER: ${{ github.event.inputs.target_ios_version || '16.1' }}
        run: |
          mkdir -p build/archive
          
          xcodebuild archive \
            -workspace "VLC.xcworkspace" \
            -scheme "$SCHEME" \
            -configuration "$CONFIG" \
            -destination "generic/platform=iOS" \
            -archivePath "build/archive/VLC-Ultimate.xcarchive" \
            IPHONEOS_DEPLOYMENT_TARGET="$IOS_VER" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            COMPILER_INDEX_STORE_ENABLE=NO \
            SWIFT_COMPILATION_MODE=wholemodule

      - name: Package & Ad-Hoc Sign IPA for iOS 16+ Sideloading
        run: |
          mkdir -p build/ipa/Payload
          APP_PATH=$(find build/archive/VLC-Ultimate.xcarchive/Products/Applications -name "*.app" -maxdepth 1)
          APP_NAME=$(basename "$APP_PATH")
          echo "Found compiled bundle: $APP_NAME at $APP_PATH"
          
          cp -R "$APP_PATH" build/ipa/Payload/
          
          # iOS 16+ requires an ad-hoc code signature to satisfy AMFI Gatekeeper on sideloaded apps
          echo "Applying ad-hoc signature for iOS 16+ sideloading compatibility..."
          codesign --force --deep --sign - --timestamp=none "build/ipa/Payload/$APP_NAME" || true
          
          cd build/ipa
          zip -qr "VLC-Ultimate-Hikaproj.ipa" Payload
          cd ../..
          
          IPA_SIZE=$(du -h build/ipa/VLC-Ultimate-Hikaproj.ipa | cut -f1)
          SHA256=$(shasum -a 256 build/ipa/VLC-Ultimate-Hikaproj.ipa | cut -d ' ' -f1)
          
          echo "IPA_SIZE=$IPA_SIZE" >> $GITHUB_ENV
          echo "IPA_SHA256=$SHA256" >> $GITHUB_ENV
          echo "Generated IPA Size: $IPA_SIZE"
          echo "SHA256: $SHA256"

      - name: Generate Build Summary
        run: |
          cat << EOF >> $GITHUB_STEP_SUMMARY
          # 🚀 VLC Ultimate Workstation IPA Build Summary
          **Customized & Powered by [Hikaproj](https://hikaproj.com)**
          - 🐦 **X (Twitter):** [@hikaproj](https://x.com/hikaproj)
          - 🌐 **Website:** [hikaproj.com](https://hikaproj.com)
          - 📩 **Contact:** [hikaproj.com/new/contact](https://hikaproj.com/new/contact)

          ### 📦 Artifact Details
          | Attribute | Value |
          | :--- | :--- |
          | **Package Name** | \`VLC-Ultimate-Hikaproj.ipa\` |
          | **File Size** | \`${{ env.IPA_SIZE }}\` |
          | **Target OS** | **iOS ${{ github.event.inputs.target_ios_version || '16.1' }}+** |
          | **Scheme** | \`${{ github.event.inputs.scheme_name || 'VLC-iOS-no-watch' }}\` |
          | **Configuration** | \`${{ github.event.inputs.build_configuration || 'Release' }}\` |
          | **SHA256** | \`${{ env.IPA_SHA256 }}\` |

          ### 📲 Sideloading Instructions (iOS 16+)
          1. Download \`VLC-Ultimate-Hikaproj.ipa\` from Artifacts below.
          2. Install using **AltStore**, **TrollStore**, **Sideloadly**, or **Scarlet**.
          3. On iOS 16+, enable **Developer Mode** under *Settings > Privacy & Security > Developer Mode* if prompted.
          EOF

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VLC-Ultimate-Hikaproj-iOS16-IPA
          path: build/ipa/VLC-Ultimate-Hikaproj.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub Release (On Tag Push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/ipa/VLC-Ultimate-Hikaproj.ipa
          name: "VLC Ultimate Workstation ${{ github.ref_name }} (iOS 16+ / Hikaproj Edition)"
          body: |
            ## VLC Ultimate Workstation Edition (iOS 16.1+)
            **Customized & Maintained by [Hikaproj](https://hikaproj.com)**
            - Website: [hikaproj.com](https://hikaproj.com)
            - Contact: [hikaproj.com/new/contact](https://hikaproj.com/new/contact)
            - X (Twitter): [@hikaproj](https://x.com/hikaproj)

            ### Package Details
            - **File:** \`VLC-Ultimate-Hikaproj.ipa\`
            - **Minimum OS:** **iOS 16.1+**
            - **SHA256:** \`${{ env.IPA_SHA256 }}\`

            ### Key Features
            - 36 Pro Studio DSP & Metal Compute Modules
            - Sony Walkman DSEE Ultimate & Vinyl Processor
            - Dolby 7.1.4ch Spatial Audio & Dialog Enhancer
            - 2-Tier Real-Time Karaoke Pitch Bar with Match Scoring
            - Anime4K CAS Sharpening & Retro CRT Metal Shader
            - 2-Screen Wipe Comparison & 10x Pinch Loupe
            - SQLite FTS5 Full-Text Subtitle & Note Search
            - Calculator Camouflage Secret Media Vault
            - Live Activities, Dynamic Island & NFC Tag Automation
            - Audio-Only Ultra Power Saver Mode (<850MB Jetsam Enforced)
          draft: false
          prerelease: false
